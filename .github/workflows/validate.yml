name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Committed dist/ is up to date
        run: git diff --exit-code -- dist/

  hacs:
    # Docker action: needs Docker on the runner (label `docker`).
    runs-on: [self-hosted, docker]
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands
